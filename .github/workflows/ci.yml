name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements.txt ruff pytest pytest-asyncio

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t fleetdeck:ci .
      - name: Starts with the example config and serves
        run: |
          mkdir -p ci/config ci/data ci/keys ci/secrets
          cp config/fleetdeck.example.yml ci/config/fleetdeck.yml
          cp config/catalog.example.yml ci/config/catalog.yml
          touch ci/config/known_hosts
          chmod -R a+rwX ci
          docker run -d --name fd -p 8310:8310 \
            -v "$PWD/ci/config:/config:ro" -v "$PWD/ci/data:/data" \
            -v "$PWD/ci/keys:/keys:ro" -v "$PWD/ci/secrets:/secrets:ro" \
            --user 1000:1000 fleetdeck:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8310/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8310/api/health | grep -q '"status":"ok"' || { docker logs fd; exit 1; }
          curl -sf http://127.0.0.1:8310/ | grep -q 'confirm-token' || { docker logs fd; exit 1; }
          curl -sf http://127.0.0.1:8310/actions | grep -q 'Start VM 904' || { docker logs fd; exit 1; }
