{% extends "base.html" %}
{% block content %}

    <h3>Catalog <span class="meta">allowlist only · the console's own key</span></h3>

  </div>

      <h3>Output <span class="meta" id="term-meta">idle</span></h3>

      <h3>Terminals <span class="meta">termix</span></h3>

  </div>
</div>
